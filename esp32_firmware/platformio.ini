; PlatformIO Configuration File for UHI Micro-Climate Sensing Edge Node
; Native ESP-IDF Embedded C only

[platformio]
default_envs = esp32-espidf

[env:esp32-espidf]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600
monitor_filters = direct, esp32_exception_decoder
